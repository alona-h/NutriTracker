<div class="auth-gate">
  <div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
      <div class="auth-logo-wrap">
        <img src="assets/icons/icon-96x96.png" alt="NT" width="40" height="40"/>
      </div>
      <div class="auth-brand-text">NutriTracker</div>
      <div class="auth-brand-sub">My Life Tracker</div>
    </div>

    <!-- Heading -->
    <h1 class="auth-heading">Sign in</h1>
    <p class="auth-subheading">Enter your username and password to continue.</p>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="auth-field">
        <label class="auth-label" for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="e.g. ALICE42"
          autocomplete="username"
          autocapitalize="characters"
          class="auth-input"
          [class.auth-input--error]="error()"
        />
      </div>

      <div class="auth-field">
        <label class="auth-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          class="auth-input"
          [class.auth-input--error]="error()"
        />
        @if (error()) {
          <p class="auth-error">{{ error() }}</p>
        }
      </div>

      <button
        type="submit"
        class="auth-submit"
        [disabled]="form.invalid || isLoading()"
      >
        @if (isLoading()) {
          <span class="auth-spinner"></span>
          Signing in…
        } @else {
          Sign in
        }
      </button>
    </form>

  </div>
</div>
