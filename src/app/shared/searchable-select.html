<div class="ss-root" [class.ss-disabled]="isDisabled()">

  <!-- Trigger button -->
  <button
    type="button"
    class="ss-trigger"
    [class.ss-trigger--empty]="!selectedLabel()"
    [class.ss-open]="isOpen()"
    [disabled]="isDisabled() || null"
    (click)="toggle()"
  >
    <span class="ss-trigger-label">{{ selectedLabel() ?? placeholder }}</span>
    <svg
      class="ss-chevron"
      [class.ss-chevron--up]="isOpen()"
      width="14" height="14"
      viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"
    >
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>

  <!-- Dropdown panel -->
  @if (isOpen()) {
    <div class="ss-panel">

      <!-- Search row -->
      <div class="ss-search-row">
        <svg
          class="ss-search-icon"
          width="13" height="13"
          viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          class="ss-search-input"
          type="text"
          placeholder="Search…"
          autocomplete="off"
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event)"
          (click)="$event.stopPropagation()"
        />
      </div>

      <!-- Options list -->
      <ul class="ss-list" role="listbox">
        @if (filteredOptions().length === 0) {
          <li class="ss-no-results">No matches found</li>
        } @else {
          @for (opt of filteredOptions(); track opt.value) {
            <li
              class="ss-option"
              [class.ss-option--active]="opt.value === selectedValue()"
              role="option"
              [attr.aria-selected]="opt.value === selectedValue()"
              (click)="select(opt.value)"
            >
              {{ opt.label }}
            </li>
          }
        }
      </ul>

    </div>
  }

</div>
