<aside class="sidebar">

  <!-- Logo / Brand -->
  <div class="sidebar-logo">
    <div class="logo-icon">
      <div class="logo-mark">
        <img src="assets/icons/icon-96x96.png" alt="NT logo" width="28" height="28" class="logo-img"/>
      </div>
      <div>
        <div class="logo-text">NutriTracker</div>
        <div class="logo-sub">My Life Tracker</div>
      </div>
    </div>
    <button
      class="sidebar-close-btn"
      type="button"
      aria-label="Close navigation"
      (click)="closeSidebar.emit()"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <div class="nav-section-label">Nutrition</div>
    @for (item of navItems; track item.route) {
      <a class="nav-item" [routerLink]="item.route" routerLinkActive="active" (click)="closeSidebar.emit()">
        @if (item.icon === 'dashboard') {
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9" rx="1" ry="1"/>
            <rect x="14" y="3" width="7" height="5" rx="1" ry="1"/>
            <rect x="14" y="12" width="7" height="9" rx="1" ry="1"/>
            <rect x="3" y="16" width="7" height="5" rx="1" ry="1"/>
          </svg>
        }
        @if (item.icon === 'intake') {
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/>
            <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
        }
        @if (item.icon === 'facts') {
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/>
            <path d="M12 16v-4"/><path d="M12 8h.01"/>
          </svg>
        }
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">

    <!-- User strip -->
    <div class="user-strip">
      <div class="user-avatar">{{ userInitial() }}</div>
      <div class="user-strip-info">
        <div class="user-strip-code">{{ userLabel() }}</div>
        <div class="user-strip-label">Signed in</div>
      </div>
      <button class="btn-signout" type="button" (click)="logout()" title="Sign out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <!-- Theme toggle -->
    <button
      class="theme-toggle"
      [class.light-mode]="!isDark"
      (click)="themeToggle.emit()"
      type="button"
      aria-label="Toggle dark mode"
    >
      @if (isDark) {
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span>Dark mode</span>
      }
      @if (!isDark) {
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <span>Light mode</span>
      }
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
    </button>

  </div>
</aside>
