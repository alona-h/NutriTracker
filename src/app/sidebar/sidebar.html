<aside class="sidebar">

  <!-- Brand -->
  <div class="sidebar-brand">
    <img src="assets/icons/icon-96x96.png" alt="NutriTracker" class="sidebar-logo-img"/>
    <div>
      <div class="sidebar-brand-name">NutriTracker</div>
      <div class="sidebar-brand-sub">My Life Tracker</div>
    </div>
    <button
      class="sidebar-close-btn"
      type="button"
      aria-label="Close navigation"
      (click)="closeSidebar.emit()"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <div class="nav-group-label">Nutrition</div>

    <a class="nav-item" routerLink="/summary" routerLinkActive="active" (click)="closeSidebar.emit()">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="9" rx="1"/>
        <rect x="14" y="3" width="7" height="5" rx="1"/>
        <rect x="14" y="12" width="7" height="9" rx="1"/>
        <rect x="3" y="16" width="7" height="5" rx="1"/>
      </svg>
      <span>Daily Summary</span>
    </a>

    <a class="nav-item" routerLink="/log" routerLinkActive="active" (click)="closeSidebar.emit()">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
        <path d="M7 2v20"/>
        <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
      </svg>
      <span>Nutrition Log</span>
    </a>

    <a class="nav-item" routerLink="/foods" routerLinkActive="active" (click)="closeSidebar.emit()">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/>
        <path d="M12 16v-4"/><path d="M12 8h.01"/>
      </svg>
      <span>Food Database</span>
    </a>

    <div class="nav-group-label">Wellness</div>

    <a class="nav-item" routerLink="/insights" routerLinkActive="active" (click)="closeSidebar.emit()">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
        <path d="M12 17h.01"/>
        <circle cx="12" cy="12" r="10"/>
      </svg>
      <span>Insights</span>
    </a>

    <a class="nav-item" routerLink="/profile" routerLinkActive="active" (click)="closeSidebar.emit()">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">

    <!-- Night mode toggle -->
    <button
      class="sidebar-theme-btn"
      type="button"
      [class.sidebar-theme-btn-active]="isNight"
      (click)="themeToggle.emit()"
    >
      @if (isNight) {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <span>Light mode</span>
      } @else {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span>Night mode</span>
      }
    </button>

    <!-- User strip -->
    <div class="sidebar-user-strip">
      <div class="sidebar-avatar">{{ userInitial() }}</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name">{{ userLabel() }}</div>
        <div class="sidebar-user-meta">Signed in</div>
      </div>
      <button class="btn-signout" type="button" (click)="logout()" title="Sign out">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

</aside>
